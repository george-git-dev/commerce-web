<fieldset class="opts">
  <legend class="opts__legend">Opções de entrega</legend>
  @for (option of options(); track option.id) {
    <label class="opts__item" [class.opts__item--active]="selected() === option.id">
      <input
        type="radio"
        name="shipping-option"
        [checked]="selected() === option.id"
        (change)="selected.set(option.id)"
      />
      <span class="opts__text">
        <strong>{{ option.label }}</strong>
        @if (option.maxDays) {
          <small>{{ option.minDays }} a {{ option.maxDays }} dias úteis</small>
        }
        @if (option.note) {
          <small class="opts__note">{{ option.note }}</small>
        }
      </span>
      <span class="opts__price" [class.opts__price--free]="allFree() || !option.price">
        {{ allFree() || !option.price ? 'Grátis' : (option.price | currency: 'BRL') }}
      </span>
    </label>
  }
</fieldset>
