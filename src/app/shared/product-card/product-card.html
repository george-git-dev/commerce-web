@let item = product();

<article class="card">
  <div class="card__media">
    <img [src]="placeholderImage" [alt]="item.name" width="800" height="800" loading="lazy" />
    @if (item.promotionActive) {
      <span class="card__badge card__badge--sale">Oferta</span>
    }
    <button matIconButton class="card__wish" aria-label="Adicionar aos favoritos">
      <mat-icon>favorite_border</mat-icon>
    </button>
  </div>

  <div class="card__body">
    <h3 class="card__name">{{ item.name }}</h3>
    <p class="card__subtitle">{{ item.categoryName }} · {{ item.brandName }}</p>

    <p class="card__price">
      <strong>{{ item.finalPrice | currency: 'BRL' }}</strong>
      @if (item.promotionActive && item.finalPrice < item.price) {
        <s>{{ item.price | currency: 'BRL' }}</s>
      }
    </p>

    <button
      matButton="filled"
      class="card__buy"
      [disabled]="!item.active || item.stock <= 0"
      (click)="addToCart.emit(item)"
    >
      <mat-icon>shopping_cart</mat-icon>
      {{ item.active && item.stock > 0 ? 'Adicionar ao carrinho' : 'Indisponível' }}
    </button>
  </div>
</article>
