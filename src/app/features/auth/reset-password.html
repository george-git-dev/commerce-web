<section class="auth ui-section">
  <div class="ui-container auth__container">
    <div class="auth__card">
      @if (validLink()) {
        <h1>Crie uma senha nova</h1>
        <p class="auth__subtitle">Use pelo menos {{ minPassword }} caracteres.</p>
        <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label>
            <span>Senha nova</span>
            <span class="auth__password">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="new-password"
                [attr.aria-invalid]="
                  (form.controls.password.invalid && form.controls.password.touched) || null
                "
              />
              <button
                type="button"
                class="auth__eye"
                [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
                (click)="showPassword.set(!showPassword())"
              >
                <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </span>
            @if (form.controls.password.invalid && form.controls.password.touched) {
              <small class="auth__error">Pelo menos {{ minPassword }} caracteres.</small>
            }
          </label>
          <label>
            <span>Confirmar senha nova</span>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="confirm"
              autocomplete="new-password"
              [attr.aria-invalid]="
                (form.hasError('mismatch') && form.controls.confirm.touched) || null
              "
            />
            @if (form.hasError('mismatch') && form.controls.confirm.touched) {
              <small class="auth__error">As senhas não conferem.</small>
            }
          </label>
          @if (error()) {
            <p class="auth__error auth__error--form" role="alert">{{ error() }}</p>
          }
          <button matButton="filled" class="ui-cta auth__submit" type="submit">Salvar senha</button>
        </form>
      } @else {
        <h1>Link inválido</h1>
        <p class="auth__subtitle" role="alert">
          Este link expirou ou já foi usado. Peça um novo para criar sua senha.
        </p>
        <a matButton="filled" class="ui-cta auth__submit" routerLink="/esqueci-senha">
          Pedir novo link
        </a>
      }

      <p class="auth__back">
        <a routerLink="/login"
          ><mat-icon aria-hidden="true">arrow_back</mat-icon> Voltar para o login</a
        >
      </p>
    </div>
  </div>
</section>
