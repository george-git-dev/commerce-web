<section class="categories">
  <img class="categories__bg" [src]="imagery.categoriesBand" alt="" loading="lazy" />

  <div class="ui-container categories__inner">
    <header class="categories__head">
      <span class="ui-eyebrow">Categorias</span>
      <h2>Explore por categoria</h2>
      <p>Perfumes, kits e cuidados para o corpo — para cada momento.</p>
    </header>

    <div class="categories__grid">
      @for (category of categories(); track category.id) {
        <a class="tile" routerLink="/produtos" [queryParams]="queryParamsFor(category)">
          @if (category.image) {
            <img
              class="tile__bg"
              [ngSrc]="category.image"
              alt=""
              fill
              sizes="(min-width: 640px) 25vw, 50vw"
            />
          }
          <mat-icon class="tile__icon">{{ category.icon }}</mat-icon>
          <span class="tile__name">{{ category.name }}</span>
          <span class="tile__text">{{ category.text }}</span>
          <span class="tile__link">Explorar <mat-icon>arrow_forward</mat-icon></span>
        </a>
      }
    </div>
  </div>
</section>
