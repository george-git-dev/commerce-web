<section class="hero">
  <picture class="hero__bg">
    <source [srcset]="imagery.heroSmall" media="(max-width: 900px)" />
    <img [src]="imagery.hero" alt="" width="1920" height="1080" fetchpriority="high" />
  </picture>

  <div class="ui-container hero__inner">
    <div class="hero__copy">
      <span class="ui-eyebrow">Perfumes árabes</span>
      <h1>A fragrância que<br />traduz quem você é</h1>
      <p>
        Eau de parfum de alta concentração, com fixação que atravessa o dia. Notas amadeiradas,
        orientais e florais selecionadas frasco a frasco.
      </p>
      <a matButton="filled" class="ui-cta hero__btn" routerLink="/" [fragment]="sections.products">
        Explorar perfumes
        <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </a>
    </div>
  </div>
</section>
