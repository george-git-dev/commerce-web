<section [id]="sections.contact" class="cta">
  <div class="ui-container cta__inner">
    <span class="ui-eyebrow">Consultoria olfativa</span>
    <h2>Não sabe qual fragrância escolher?</h2>
    <p>
      Conte para a nossa equipe o seu perfil, a ocasião e as notas que você gosta. Indicamos a
      fragrância certa e montamos o pedido com você.
    </p>
    <div class="cta__actions">
      <a
        matButton="filled"
        class="ui-cta"
        [href]="store.whatsappHref"
        target="_blank"
        rel="noopener"
      >
        Falar com consultor
      </a>
      <a matButton="outlined" class="ui-cta" [href]="store.phoneHref">
        {{ store.phone }}
      </a>
    </div>
  </div>
</section>
