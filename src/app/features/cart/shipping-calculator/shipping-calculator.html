<form class="ship" (submit)="calculate($event)" novalidate>
  <label class="ship__label" for="shipping-cep">Calcular frete</label>
  <div class="ship__row">
    <input
      id="shipping-cep"
      type="text"
      inputmode="numeric"
      autocomplete="postal-code"
      placeholder="00000-000"
      maxlength="9"
      [value]="draft()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? 'shipping-cep-error' : null"
      (input)="onInput($event)"
    />
    <button matButton="outlined" type="submit">Calcular</button>
  </div>
  @if (error()) {
    <p id="shipping-cep-error" class="ship__error" role="alert">{{ error() }}</p>
  }
  <a
    class="ship__help"
    href="https://buscacepinter.correios.com.br/app/endereco/index.php"
    target="_blank"
    rel="noopener"
  >
    Não sei meu CEP
  </a>
</form>

@if (options().length) {
  <fieldset class="ship__options">
    <legend class="ship__legend">Opções de entrega</legend>
    @for (option of options(); track option.id) {
      <label class="ship__option" [class.ship__option--active]="selected() === option.id">
        <input
          type="radio"
          name="shipping-option"
          [checked]="selected() === option.id"
          (change)="selected.set(option.id)"
        />
        <span class="ship__text">
          <strong>{{ option.label }}</strong>
          <small>{{ option.minDays }} a {{ option.maxDays }} dias úteis</small>
        </span>
        <span class="ship__price" [class.ship__price--free]="!option.price">
          {{ option.price ? (option.price | currency: 'BRL') : 'Grátis' }}
        </span>
      </label>
    }
  </fieldset>
}
